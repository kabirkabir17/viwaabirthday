<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untukmu, di hari spesialmu</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c0e1f;--bg2:#2e1330;--rose:#f08aa4;--blush:#fbe3e8;--gold:#ecc98a;--muted:#c9a9b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c0e1f;--bg2:#2e1330}}
:root[data-theme="dark"]{--bg:#1c0e1f;--bg2:#2e1330}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg) 70%);color:var(--blush);font-family:'Nunito',system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
.disp{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600}
main{max-width:30rem;margin:0 auto;padding:2rem 1.5rem 3rem;text-align:center;position:relative;z-index:2}

/* amplop */
#segel{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem}
#segel h1{font-size:2.4rem;line-height:1.15;margin:0}
#segel p{color:var(--muted);margin:0}
button.buka{border:0;cursor:pointer;background:var(--rose);color:#3a1022;font:600 1rem 'Nunito',sans-serif;padding:.9rem 2rem;border-radius:999px;animation:denyut 2.2s ease-in-out infinite}
button.buka:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@keyframes denyut{50%{transform:scale(1.06);box-shadow:0 0 0 14px rgba(240,138,164,.15)}}
.hati-besar{font-size:3.2rem;filter:drop-shadow(0 0 18px rgba(240,138,164,.6))}

/* isi */
#isi{display:none}
#isi.on{display:block}
.bingkai{width:min(78vw,17rem);aspect-ratio:1/1;margin:0 auto 1.8rem;border-radius:50%;overflow:hidden;border:3px solid var(--gold);background:var(--bg2);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.bingkai img{width:100%;height:100%;object-fit:cover;display:block}
.bingkai label{color:var(--muted);font-size:.9rem;padding:1rem;cursor:pointer}
.bingkai input{display:none}
h2{font-size:2.6rem;line-height:1.1;margin:0 0 .4rem}
.umur{color:var(--gold);margin:0 0 1.6rem}
#pesan{min-height:9rem;font-size:1.05rem;white-space:pre-line;text-align:left;border-left:2px solid var(--rose);padding-left:1rem}
.ttd{margin-top:1.6rem;font-size:1.5rem;color:var(--rose);opacity:0;transition:opacity 1.2s}
.ttd.on{opacity:1}
.melayang{position:fixed;bottom:-2rem;z-index:1;pointer-events:none;animation:naik linear forwards}
@keyframes naik{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){button.buka{animation:none}.melayang{display:none}}
</style>
</head>
<body>
<main>
  <section id="segel">
    <div class="hati-besar" aria-hidden="true">💌</div>
    <h1 class="disp">Ada sesuatu untukmu</h1>
    <p>Ketuk untuk membukanya</p>
    <button class="buka" id="btn">Buka</button>
  </section>

  <section id="isi">
    <div class="bingkai" id="bingkai"></div>
    <h2 class="disp" id="judul"></h2>
    <p class="umur disp" id="umur"></p>
    <div id="pesan" aria-live="polite"></div>
    <div class="ttd disp" id="ttd"></div>
  </section>
</main>

var PESAN = "Dua puluh empat. Angka yang cantik, ya? Entah kenapa, rasanya angka itu jadi lebih istimewa karena ada seseorang yang sedang merayakannya—seseorang yang diam-diam punya tempat tersendiri di pikiranku.\n\nAku memang nggak pandai merangkai kata-kata indah, apalagi menulis puisi. Jadi, anggap saja tulisan kecil ini sebagai caraku menyampaikan sesuatu yang mungkin belum cukup berani aku ucapkan secara langsung.\n\nKalau nanti kamu tersenyum saat membaca ini, semoga kamu tahu bahwa ada seseorang yang ikut bahagia hanya karena melihatmu bahagia. Dan kalau boleh meminta satu hal kepada semesta, aku ingin diberi kesempatan untuk menjadi salah satu alasan di balik senyummu, bukan hanya hari ini, tapi juga di hari-hari yang akan datang.\n\nSelamat bertambah usia, ya. Semoga dunia lebih lembut kepadamu, semoga langkahmu selalu menemukan arah, dan semoga hal-hal baik datang tanpa harus selalu kamu perjuangkan sendirian.\n\nAku nggak tahu akan sejauh apa cerita ini berjalan. Aku juga nggak ingin memaksakan apa pun atau membuatmu merasa harus membalas sesuatu. Aku hanya ingin kamu tahu bahwa ada seseorang yang dengan tulus ingin mengenalmu lebih jauh, memahami hal-hal kecil tentangmu, mendengarkan ceritamu, dan melihatmu tumbuh menjadi versi terbaik dari dirimu sendiri.\n\nJadi, pelan-pelan saja, ya. Aku nggak sedang berlomba dengan waktu. Aku hanya ingin menikmati setiap kesempatan untuk mengenalmu, satu demi satu.\n\nDan siapa tahu, di antara banyak hal indah yang kamu harapkan di usia yang baru ini, semesta diam-diam sedang menyiapkan satu cerita kecil tentang kita.\n\nSekali lagi, selamat ulang tahun. Semoga kamu selalu punya alasan untuk tersenyum, bahkan pada hari-hari yang terasa berat.\n\nDan kalau suatu hari kamu bertanya siapa yang diam-diam mendoakanmu lebih lama dari yang kamu tahu, semoga kamu ingat tulisan kecil ini.";
/* ============================= */

var $ = function(id){return document.getElementById(id)};
$('judul').textContent = 'Selamat ulang tahun, ' + NAMA;
$('umur').textContent = UMUR ? 'Yang ke-' + UMUR + ' ✦' : '';
$('ttd').textContent = 'Salam hangat, ' + DARI;

var bf = $('bingkai');
if (FOTO) { var im = new Image(); im.src = FOTO; im.alt = 'Foto ' + NAMA; bf.appendChild(im); }
else {
  bf.innerHTML = '<label>Ketuk untuk pilih foto<input type="file" accept="image/*"></label>';
  bf.querySelector('input').onchange = function(e){
    var f = e.target.files[0]; if(!f) return;
    var u = URL.createObjectURL(f); bf.innerHTML = '<img alt="Foto" src="'+u+'">';
  };
}

function hati(){
  var h = document.createElement('div');
  h.className = 'melayang';
  h.textContent = ['♥','♡','✦','❤'][Math.floor(Math.random()*4)];
  h.style.left = Math.random()*95 + 'vw';
  h.style.fontSize = (14 + Math.random()*22) + 'px';
  h.style.color = Math.random() > .5 ? '#f08aa4' : '#ecc98a';
  h.style.animationDuration = (5 + Math.random()*5) + 's';
  document.body.appendChild(h);
  setTimeout(function(){h.remove()}, 10500);
}

function ketik(el, teks, selesai){
  var i = 0;
  (function t(){
    el.textContent = teks.slice(0, ++i);
    if (i < teks.length) setTimeout(t, 38); else selesai && selesai();
  })();
}

$('btn').onclick = function(){
  $('segel').style.display = 'none';
  $('isi').classList.add('on');
  window.scrollTo(0,0);
  var n = 0, iv = setInterval(function(){ hati(); if(++n > 40) clearInterval(iv); }, 350);
  ketik($('pesan'), PESAN, function(){ $('ttd').classList.add('on'); });
};
</script>
